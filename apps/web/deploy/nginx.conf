# MF Bank web — Nginx site config (copy dist/ to /var/www/mf-bank).
# Sets the security headers a page cannot set from <meta>, the SPA fallback,
# caching rules and the /api reverse proxy (no CORS, API origin hidden).

server {
  listen 443 ssl http2;
  server_name mfbank.example.com;              # ← bank's domain

  ssl_certificate     /etc/ssl/mfbank/fullchain.pem;
  ssl_certificate_key /etc/ssl/mfbank/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  root /var/www/mf-bank;
  index index.html;
  server_tokens off;

  # ---- security headers (OWASP Secure Headers) ----
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;   # full policy is in index.html
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), clipboard-read=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  # ---- SPA: every route returns index.html, never cached ----
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  # ---- hashed build assets: cache for a year ----
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # ---- API reverse proxy: set VITE_API_URL=/api/mfmbs/mbintf/ina/processibsrequest.jsp ----
  location /api/ {
    proxy_pass https://ibuat.scu.sc:8081/;      # ← production API
    proxy_ssl_server_name on;
    proxy_set_header Host ibuat.scu.sc;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Cache-Control "no-store" always;
    client_max_body_size 1m;
  }
}

# redirect plain HTTP
server {
  listen 80;
  server_name mfbank.example.com;
  return 301 https://$host$request_uri;
}
